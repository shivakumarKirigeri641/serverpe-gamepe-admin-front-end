<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0b0910" />
    <title>MastiPe Admin</title>

    <!--
      NO web fonts.
      ---------------------------------------------------------------------
      This used to pull Inter and JetBrains Mono from Google. It was the only
      external request the panel made, and it earned its keep right up until
      it started failing:

        Access to font at 'https://fonts.gstatic.com/...' from origin
        'https://admin.mastipe.in' has been blocked by CORS policy: the
        'Access-Control-Allow-Origin' header has a value 'https://mastipe.in'

      Google serves fonts with `Access-Control-Allow-Origin: *`, so that value
      cannot have come from Google. It comes from a CACHED response: the same
      font URL was fetched while on mastipe.in, something in the path reflected
      that origin back without a `Vary: Origin`, and the browser then reused
      the one cache entry for the panel's different origin. Nothing on our side
      can fix a poisoned shared cache, and a hard refresh only fixes it until
      the next time.

      tailwind.config.js already falls back to Segoe UI, then system-ui - which
      on the machines this panel is actually used from is near-identical to
      Inter. So an internal tool now loads with zero external requests, faster,
      and with one entire class of error gone for good.

      If Inter specifically is ever wanted back, self-host the woff2 files in
      /public rather than re-adding this link.
    -->

    <!-- Painted before React mounts, so a slow bundle shows the panel's own
         dark ground rather than a white flash. -->
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #0b0910; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
